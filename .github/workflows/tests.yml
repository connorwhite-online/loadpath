name: tests

on:
  push:
    branches: [main]
  pull_request:
  # by hand on any branch (Actions > tests > Run workflow, or the API): work
  # that lands on main without a pull request is checked on its branch first
  workflow_dispatch:

# One run at a time per branch: a newer push replaces a run still waiting
# for runners (the latest run covers every earlier commit), and a run
# already started finishes. 19 main runs once queued behind each other.
# A replaced run shows "cancelled" on its commit, so on main the verdict
# job at the end gives every commit a finished result: the commit status
# "tests / verdict". Read that, not the run, to know if a main commit is
# green. (A run per commit instead would queue ~32 jobs per push: a burst
# of 9 pushes on 2026-11-24 would have held the runners for hours.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The suite is split by file into groups that each take 10-15 minutes on a
  # 4-core runner (timings in the comments, from a run on 2026-11-10); in one
  # job it outgrew 55 minutes and the later files stopped being run at all.
  # A group runs every file in it and fails if any failed, so one red file
  # does not hide the rest. A new test file goes in the group it fits, or a
  # new one if a group would pass ~20 minutes.
  tests:
    name: tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core            # run_tests 0.5 min, test_loadpath 12
            files: tests/run_tests.py tests/test_loadpath.py
          - group: solvers         # ~9 min
            files: >-
              tests/test_nonlinear.py tests/test_interface.py tests/test_dfm.py tests/test_voxels.py
              tests/test_pressure.py tests/test_durability.py tests/test_physics.py tests/test_first_try.py tests/test_calibration.py
              tests/test_impact.py tests/test_switch.py tests/test_switch_lattice.py
          - group: products        # ~13 min (handoff 3.5, kicad 3.3)
            files: >-
              tests/test_handoff.py tests/test_shells.py tests/test_capture.py tests/test_shroud.py tests/test_feel.py
              tests/test_touch_zones.py tests/test_cooling.py tests/test_rods.py tests/test_wires.py tests/test_enclosure_material.py
              tests/test_stack.py tests/test_kicad.py tests/test_cooling_contacts.py tests/test_brief_paths.py
          - group: seats           # friction, preload, CalculiX and heat on seats
            files: tests/test_seat_friction.py
          - group: antenna         # ~10 min (rf 1, antenna 8)
            files: tests/test_rf.py tests/test_antenna.py tests/test_frameband.py
          # the MCP server's tool surface (the mcp extra only here)
          - group: mcp             # ~1 min
            extras: ",mcp"
            files: tests/test_mcp_surface.py
          - group: casting         # ~8 min
            files: tests/test_casting.py tests/test_slipcast.py tests/test_castfeed.py
          - group: enclosure       # ~11 min
            files: tests/test_enclosure.py
            pytest: tests/test_retention.py
          - group: vibration       # vibration 9.5 min, direct 2, tetsolve 0.5
            pytest: tests/test_pools.py tests/test_bucklingopt.py tests/test_direct.py tests/test_vibration.py tests/test_tetsolve.py
          - group: analysis        # ~12 min (study_limits 3, reactions 2)
            pytest: >-
              tests/test_mass_properties.py tests/test_inertia_relief.py tests/test_point_maps.py
              tests/test_lattice_library.py tests/test_textures.py tests/test_layerfiles.py
              tests/test_reactions.py tests/test_stock.py tests/test_fuse.py tests/test_nesting.py tests/test_fe_export.py tests/test_tpms_more.py
              tests/test_aero.py tests/test_ribs.py tests/test_patterns.py tests/test_vdb.py
              tests/test_reconstruct_fragments.py tests/test_pinch_memory.py tests/test_study_limits.py tests/test_passes_but_wrong.py tests/test_rotor_blockage.py
              tests/test_face_bridge.py tests/test_reconstruct_slits.py tests/test_bundle.py
              tests/test_stress_read.py tests/test_checkpoint.py tests/test_stresslimit.py tests/test_submodel_size.py
              tests/test_clean_parts.py tests/test_drawn_transitions.py
          # the groups below (2026-11-12) hold files that were in no group,
          # so CI never ran them; tests/test_ci_groups.py now fails on any
          # tests/ file left out. Times from a 4-core cloud box, 3 at once.
          - group: evals           # test_evals ~30 min there
            files: tests/test_evals.py
          - group: buckling        # ~30 min there
            pytest: tests/test_buckling_check.py
          - group: lattice         # ~20 min there (lattice_tensors 19)
            files: tests/test_brief_kinds_lattice.py tests/test_lattice3mf.py
            pytest: >-
              tests/test_lattice_tensors.py tests/test_lattice_print.py tests/test_struts.py tests/test_cores.py
              tests/test_hex8_im.py
          - group: study           # ~22 min there
            files: >-
              tests/test_ci_groups.py tests/test_recall.py tests/test_escape.py tests/test_contact.py
              tests/test_fields.py tests/test_directions.py tests/test_binding.py tests/test_agent_path.py
              tests/test_brief_kinds_multimat.py tests/test_fits.py tests/test_process.py tests/test_narrowband.py
              tests/test_multimat_fixes.py tests/test_coopt.py tests/test_assembly.py tests/test_benchmarks.py
            pytest: >-
              tests/test_tune.py tests/test_brief_kinds_heatx.py tests/test_sizing.py tests/test_tetsizing.py
              tests/test_dfm_reference.py tests/test_seats.py tests/test_joints.py
          - group: making          # ~17 min there
            files: >-
              tests/test_flowtopo.py tests/test_conjugate.py tests/test_heatx_fixes.py tests/test_buildsim.py
              tests/test_manufacture.py tests/test_thermal.py tests/test_mg.py tests/test_mesh_block.py
              tests/test_slicer.py tests/test_crease.py
            pytest: >-
              tests/test_flow.py tests/test_airflow.py tests/test_heatx_rating.py tests/test_printsetup.py tests/test_metal.py
              tests/test_amgfast.py tests/test_selfsupport.py tests/test_cutcell.py tests/test_explore.py
              tests/test_porous.py tests/test_meshops.py tests/test_massfill.py tests/test_femops.py
              tests/test_stability.py tests/test_fieldtorch.py tests/test_ridges.py tests/test_members.py
          # OpenCascade (the step extra) and build123d only here; without
          # them these files skip or fail to import
          - group: step            # ~16 min there (build 6)
            extras: ",step,surface"
            pip: build123d
            files: >-
              tests/test_cadimport.py tests/test_latticestep.py tests/test_sharp.py tests/test_fit.py
              tests/test_subd.py tests/test_subdedit.py tests/test_build.py tests/test_surfacing.py
              tests/test_jointcad.py
          # NeuralFoil (the aero extra) only here: the propeller's polars
          - group: aero            # ~3 min
            extras: ",aero"
            files: tests/test_propeller.py tests/test_fan.py
          # libigl (the exterior extra) only here: the groups above check the
          # paths without it
          - group: exterior
            extras: ",exterior,scan"
            files: >-
              tests/test_exterior.py tests/test_scan.py tests/test_surfacecheck.py tests/test_envelope.py
              tests/test_reference_sketch.py
            pytest: >-
              tests/test_integrity.py tests/test_materials.py tests/test_preview.py tests/test_interfaces.py tests/test_multimat.py
              tests/test_interlock.py tests/test_threemf_multi.py tests/test_voxelprint.py
              tests/test_field_materials.py tests/test_published_experiments.py tests/test_fieldjit.py
              tests/test_print.py tests/test_mixed_lu.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # gmsh needs libGLU; CalculiX for the cross-check's second solver
      - run: sudo apt-get update -q && sudo apt-get install -y -q libglu1-mesa calculix-ccx
      - run: pip install -e ".[render,crosscheck${{ matrix.extras }}]" pytest lxml ${{ matrix.pip }}
      - name: plain-python test files
        if: matrix.files
        env:
          FILES: ${{ matrix.files }}
        run: |
          rc=0
          for f in $FILES; do
            echo "::group::$f"; s=$SECONDS
            python "$f" || { rc=1; echo "::error::$f failed"; }
            echo "::endgroup::"; echo "$f: $((SECONDS - s)) s"
          done
          exit $rc
      - name: pytest files
        if: matrix.pytest && (success() || failure())
        env:
          FILES: ${{ matrix.pytest }}
        run: python -m pytest -q --durations=10 $FILES

  # macOS arm64 with pip's numba and no libomp or tbb: numba falls back to
  # its workqueue threading layer, which aborts the process (SIGABRT, no
  # traceback) when two Python threads run parallel kernels at once.
  # loadpath then runs load cases serially (pools.py); this job holds it to
  # that with a two-load-case run. NUMBA_THREADING_LAYER pins workqueue in
  # case the runner image ever ships libomp.
  macos-workqueue:
    runs-on: macos-latest   # arm64 (macos-14 is retired)
    timeout-minutes: 30
    env:
      NUMBA_THREADING_LAYER: workqueue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - name: numba's threading layer without the pin
        run: env -u NUMBA_THREADING_LAYER python -c "from loadpath.pools import threading_layer; print(threading_layer())"
      - run: python -m pytest -q tests/test_pools.py
      - run: python -m loadpath check tests/data/two-case-bracket.json
      - run: python -m loadpath run tests/data/two-case-bracket.json --quick --no-render --viewer none --out out

  # docs/tutorials/: each tutorial's commands, run in quick mode (coarse grid)
  # and held to its expect.json, so the docs can't drift from the code
  # (45 minutes: agent-mcp took 25.5 to 27 minutes on 2026-11-20 and was
  # cancelled at the old 30 on main aea752c and on a branch, with no change
  # to it between; the others take 10 to 19)
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tutorial: [fdm-bracket, sls-lattice-drains, heat-exchanger, impact-bumper, field-editor, urdf-arm-link,
                   step-import, lpbf-buildsim, thermal-duty-cycle, strut-lattice, agent-mcp, generated-exterior]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[render,flow,mcp,step,exterior]"
      - run: python tests/test_tutorials.py ${{ matrix.tutorial }} --keep "$RUNNER_TEMP/tutorial"
      # a failed tutorial's report, study and fields, small enough to keep: the
      # optimized part differs by CPU, so this is the only way to rebuild it
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-${{ matrix.tutorial }}
          path: |
            ${{ runner.temp }}/tutorial/**/*.json
            ${{ runner.temp }}/tutorial/**/*.field.npz
          retention-days: 7
          if-no-files-found: ignore

  # the field editor: its server, and its GPU preview against fields.py in
  # headless Chromium (SwiftShader)
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[render]"
      - run: npm install -g playwright@1.64.1 && npx playwright install --with-deps chromium
      - run: NODE_PATH="$(npm root -g)" python tests/test_editor.py

  # Every commit on main gets a finished verdict, also one whose own run was
  # replaced while queued: the status "tests / verdict" on each commit since
  # the head of the last run that finished, set to this run's result (this
  # tree holds all of them). A failure names the red jobs and the commit they
  # ran at; which of the covered commits broke it is for the reader to find.
  verdict:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, macos-workqueue, tutorials, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case " $RESULTS " in *" cancelled "*) echo "run cancelled: no verdict"; exit 0;; esac
          state=success
          for r in $RESULTS; do [ "$r" = success ] || [ "$r" = skipped ] || state=failure; done
          short=${SHA:0:7}
          if [ $state = success ]; then
            what="passed at $short"
          else
            red=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
              --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out") | .name' \
              | sed -E 's/^tests \((.*)\)$/\1/' | paste -sd, - | sed 's/,/, /g')
            what="failed at $short: ${red:-see run}"
          fi
          # the head of the newest earlier main run that ran to the end
          prev=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?branch=main&event=push&status=completed&per_page=30" \
            --jq "[.workflow_runs[] | select(.id != $RUN_ID and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // \"\"")
          shas=$SHA
          if [ -n "$prev" ] && [ "$prev" != "$SHA" ]; then
            cmp=$(gh api "repos/$REPO/compare/$prev...$SHA" --jq '.status + " " + ([.commits[].sha] | join(" "))' || echo "")
            # ahead: prev is an ancestor; anything else (a rewrite) covers this commit only
            [ "${cmp%% *}" = ahead ] && shas=${cmp#* }
          fi
          n=$(echo $shas | wc -w)
          [ $n -gt 1 ] && what="$what (covers $n commits)"
          for c in $shas; do
            gh api "repos/$REPO/statuses/$c" -f state=$state -f context="tests / verdict" \
              -f description="${what:0:140}" \
              -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" > /dev/null
            echo "$c: $state"
          done
