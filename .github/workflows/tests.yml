name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # the steps take ~25 min; apt alone has taken 12 on a slow mirror
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # gmsh needs libGLU; CalculiX for the cross-check's second solver
      - run: sudo apt-get update -q && sudo apt-get install -y -q libglu1-mesa calculix-ccx
      - run: pip install -e ".[render,crosscheck]"
      - run: python tests/run_tests.py
      - run: python tests/test_loadpath.py
      - run: python tests/test_nonlinear.py
      - run: python tests/test_interface.py
      - run: python tests/test_dfm.py
      - run: python tests/test_voxels.py
      - run: python tests/test_pressure.py
      - run: python tests/test_durability.py
      - run: python tests/test_physics.py
      - run: python tests/test_calibration.py
      - run: python tests/test_impact.py
      - run: python tests/test_switch.py
      - run: python tests/test_switch_lattice.py
      - run: python tests/test_handoff.py
      - run: python tests/test_shells.py
      - run: python tests/test_shroud.py
      - run: python tests/test_enclosure.py
      - run: python tests/test_feel.py
      - run: python tests/test_touch_zones.py
      - run: python tests/test_cooling.py
      - run: python tests/test_rods.py
      - run: python tests/test_wires.py
      - run: python tests/test_stack.py
      - run: pip install pytest && python -m pytest -q tests/test_pools.py tests/test_bucklingopt.py
      - run: python -m pytest -q tests/test_vibration.py tests/test_mass_properties.py tests/test_inertia_relief.py tests/test_point_maps.py tests/test_lattice_library.py tests/test_textures.py tests/test_layerfiles.py tests/test_reactions.py tests/test_nesting.py tests/test_fe_export.py tests/test_tpms_more.py tests/test_aero.py tests/test_ribs.py tests/test_patterns.py tests/test_vdb.py tests/test_reconstruct_fragments.py tests/test_study_limits.py tests/test_rotor_blockage.py tests/test_face_bridge.py
      # libigl (the exterior extra) last: the steps above check the paths without it
      - run: pip install -e ".[exterior]" && python tests/test_exterior.py
      - run: pip install pytest lxml && python -m pytest -q tests/test_materials.py tests/test_preview.py tests/test_interfaces.py tests/test_multimat.py tests/test_interlock.py tests/test_threemf_multi.py tests/test_voxelprint.py tests/test_field_materials.py tests/test_published_experiments.py tests/test_fieldjit.py tests/test_print.py tests/test_mixed_lu.py

  # macOS arm64 with pip's numba and no libomp or tbb: numba falls back to
  # its workqueue threading layer, which aborts the process (SIGABRT, no
  # traceback) when two Python threads run parallel kernels at once.
  # loadpath then runs load cases serially (pools.py); this job holds it to
  # that with a two-load-case run. NUMBA_THREADING_LAYER pins workqueue in
  # case the runner image ever ships libomp.
  macos-workqueue:
    runs-on: macos-latest   # arm64 (macos-14 is retired)
    timeout-minutes: 30
    env:
      NUMBA_THREADING_LAYER: workqueue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - name: numba's threading layer without the pin
        run: env -u NUMBA_THREADING_LAYER python -c "from loadpath.pools import threading_layer; print(threading_layer())"
      - run: python -m pytest -q tests/test_pools.py
      - run: python -m loadpath check tests/data/two-case-bracket.json
      - run: python -m loadpath run tests/data/two-case-bracket.json --quick --no-render --viewer none --out out

  # docs/tutorials/: each tutorial's commands, run in quick mode (coarse grid)
  # and held to its expect.json, so the docs can't drift from the code
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tutorial: [fdm-bracket, sls-lattice-drains, heat-exchanger, impact-bumper, field-editor, urdf-arm-link,
                   step-import, lpbf-buildsim, thermal-duty-cycle, strut-lattice, agent-mcp, generated-exterior]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[render,flow,mcp,step,exterior]"
      - run: python tests/test_tutorials.py ${{ matrix.tutorial }}

  # the field editor: its server, and its GPU preview against fields.py in
  # headless Chromium (SwiftShader)
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[render]"
      - run: npm install -g playwright@1.64.1 && npx playwright install --with-deps chromium
      - run: NODE_PATH="$(npm root -g)" python tests/test_editor.py
