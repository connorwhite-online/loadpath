name: publish

# Pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) builds the
# sdist and wheel, checks the tag matches pyproject's version, smoke-tests the
# wheel in a clean environment, and uploads to PyPI with trusted publishing
# (OIDC: no API token stored anywhere). PyPI side: a trusted publisher for
# this repo, workflow publish.yml, environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but pyproject says $v"; exit 1; }
      # PyPI has no copy of docs/ or the images: point the README's relative
      # links at GitHub, pinned to this tag
      - run: python .github/scripts/pypi_readme.py README.md "$GITHUB_REF_NAME"
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/loadpath --help > /dev/null && /tmp/v/bin/loadpath examples > /dev/null
          /tmp/v/bin/python -I -c "import loadpath, loadpath.fields, loadpath.verify"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/loadpath/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
