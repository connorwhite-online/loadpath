[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.0"
description = "Generative design for printed parts: topology optimization from keep-outs, preserved geometry and loads, verified in real units."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyamg>=5.0",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "manifold3d>=3.0",
  "rtree>=1.0",
]
keywords = ["topology optimization", "generative design", "3d printing", "fea", "cad"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8"]
mcp = ["mcp>=2.0", "matplotlib>=3.8"]
# independent cross-check on a tetrahedral mesh (crosscheck.py); gmsh is GPL
# and is run as a tool, not part of loadpath's own code
crosscheck = ["gmsh>=4.11", "scikit-fem>=10"]

[project.scripts]
loadpath = "loadpath.__main__:main"

# The package is this directory (it lives inside Materialize's CAD sidecar
# today, cad-runner/loadpath/), so map it explicitly instead of a src/ layout.
[tool.setuptools]
package-dir = { "loadpath" = ".", "loadpath.evals" = "evals" }
packages = ["loadpath", "loadpath.evals"]

[tool.setuptools.package-data]
"loadpath.evals" = ["cases/*.json", "cases/*.stl"]
