<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; font: 15px/1.3 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #222; }
  #title { height: 34px; line-height: 34px; text-align: center; font-size: 17px; }
  #row { display: flex; }
  .panel { display: flex; flex-direction: column; align-items: center; }
  .label { text-align: center; color: #444; }
  canvas { display: block; }
  #bar { width: 110px; display: flex; align-items: center; justify-content: center; }
  #bar .inner { display: flex; align-items: stretch; gap: 6px; height: 62%; }
  #bar .ramp { width: 14px; border-radius: 3px; }
  #bar .ticks { display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: #444; }
  #bar .name { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; color: #444; text-align: center; }
</style>
<script type="importmap">
{ "imports": { "three": "./three/three.module.js" } }
</script>
</head>
<body>
<div id="title"></div>
<div id="row"></div>
<script type="module">
import * as THREE from "three";
import { toCreasedNormals } from "./three/BufferGeometryUtils.js";

const toLin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));

async function load(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return new Float32Array(await r.arrayBuffer());
}

async function main() {
  const S = await (await fetch("scene.json")).json();
  const title = document.getElementById("title");
  if (S.title) title.textContent = S.title; else title.remove();
  const row = document.getElementById("row");
  const [W, H] = S.panel;
  for (const P of S.panels) {
    const div = document.createElement("div");
    div.className = "panel";
    if (S.labelHeight) {
      const l = document.createElement("div");
      l.className = "label";
      l.style.height = l.style.lineHeight = S.labelHeight + "px";
      l.textContent = P.label || "";
      div.appendChild(l);
    }
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(W, H);
    renderer.setClearColor(0xffffff, 1);
    div.appendChild(renderer.domElement);
    row.appendChild(div);

    const scene = new THREE.Scene();
    // fit the points (the content's hull) as seen from the view, with a margin
    const [elev, azim] = P.view.map((d) => (d * Math.PI) / 180);
    const dir = new THREE.Vector3(Math.cos(elev) * Math.cos(azim), Math.cos(elev) * Math.sin(azim), Math.sin(elev));
    const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 0, 1), dir).normalize();
    const upv = new THREE.Vector3().crossVectors(dir, right).normalize();
    const pts = P.points.map((q) => new THREE.Vector3(...q));
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, zc = 0;
    for (const q of pts) {
      const x = q.dot(right), y = q.dot(upv);
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); zc += q.dot(dir) / pts.length;
    }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const center = right.clone().multiplyScalar(cx).addScaledVector(upv, cy).addScaledVector(dir, zc);
    const fov = 20, t = Math.tan((fov / 2) * Math.PI / 180), margin = 1.06, aspect = W / H;
    const camera = new THREE.PerspectiveCamera(fov, aspect, 0.01, 1e6);
    camera.up.set(0, 0, 1);
    // the distance at which every point is inside the frustum (nearer points look bigger)
    let dist = 0;
    for (const q of pts) {
      const z = q.dot(dir) - zc;
      dist = Math.max(dist, margin * Math.abs(q.dot(right) - cx) / (t * aspect) + z, margin * Math.abs(q.dot(upv) - cy) / t + z);
    }
    camera.position.copy(center).addScaledVector(dir, dist);
    camera.near = dist / 100; camera.far = dist * 10;
    camera.lookAt(center);
    camera.updateProjectionMatrix();

    // studio lighting fixed to the view: sky from +z, a key over the
    // viewer's right shoulder, a cool rim from behind
    const hemi = new THREE.HemisphereLight(0xffffff, 0x7d828c, 1.25);
    hemi.position.set(0, 0, 1);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffffff, 1.7);
    key.position.copy(center).addScaledVector(dir, 1).addScaledVector(right, 0.45).add(new THREE.Vector3(0, 0, 0.9));
    key.target.position.copy(center);
    scene.add(key, key.target);
    const rim = new THREE.DirectionalLight(0xdfe7ff, 0.55);
    rim.position.copy(center).addScaledVector(dir, -1).add(new THREE.Vector3(0, 0, 0.6));
    rim.target.position.copy(center);
    scene.add(rim, rim.target);

    for (const M of P.meshes) {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(await load(M.pos), 3));
      let vc = false;
      if (M.col) {
        const c = await load(M.col);
        for (let i = 0; i < c.length; i++) c[i] = toLin(c[i]);
        g.setAttribute("color", new THREE.BufferAttribute(c, 3));
        vc = true;
      }
      const geo = toCreasedNormals(g, (M.crease * Math.PI) / 180);
      const transparent = M.opacity < 0.99;
      const mat = new THREE.MeshStandardMaterial({
        color: vc ? 0xffffff : new THREE.Color().setRGB(...M.color, THREE.SRGBColorSpace),
        vertexColors: vc, roughness: M.roughness, metalness: M.metalness,
        transparent, opacity: M.opacity, depthWrite: !transparent, side: transparent ? THREE.DoubleSide : THREE.FrontSide,
      });
      const mesh = new THREE.Mesh(geo, mat);
      if (transparent) mesh.renderOrder = 2;
      scene.add(mesh);
    }
    for (const A of P.arrows) {
      const vec = new THREE.Vector3(...A.vec);
      const len = vec.length();
      if (!(len > 0)) continue;
      const d = vec.clone().normalize();
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setRGB(...A.color, THREE.SRGBColorSpace), roughness: 0.45 });
      const head = 0.28 * len, shaftLen = len - head;
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * len, 0.035 * len, shaftLen, 24), mat);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.1 * len, head, 32), mat);
      const tip = new THREE.Vector3(...A.tip);
      const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
      shaft.quaternion.copy(q); cone.quaternion.copy(q);
      shaft.position.copy(tip).addScaledVector(d, -head - shaftLen / 2);
      cone.position.copy(tip).addScaledVector(d, -head / 2);
      for (const m of [shaft, cone]) { m.renderOrder = 3; scene.add(m); }
    }
    renderer.render(scene, camera);
  }
  if (S.colorbar) {
    const C = S.colorbar;
    const bar = document.createElement("div");
    bar.id = "bar";
    bar.style.height = H + S.labelHeight + "px";
    bar.innerHTML = `<div class="inner"><div class="name"></div><div class="ramp"></div><div class="ticks"><span class="hi"></span><span class="lo"></span></div></div>`;
    bar.querySelector(".ramp").style.background = `linear-gradient(to top, ${C.stops.join(", ")})`;
    bar.querySelector(".name").textContent = C.label;
    bar.querySelector(".hi").textContent = C.hi;
    bar.querySelector(".lo").textContent = C.lo;
    row.appendChild(bar);
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.renderDone = true;
}

main().catch((e) => { window.renderError = String(e && e.stack || e); });
</script>
</body>
</html>
