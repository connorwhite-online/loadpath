[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.5"
description = "Agent-driven generative design for printed parts: describe what to build, get a topology-optimized part with its loads, interfaces and printability checked."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyamg>=5.0",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "manifold3d>=3.0",
  "rtree>=1.0",
  # compiled kernels for meshing big lattices (selfx.py, meshops.py, struts.py); each has a numpy fallback
  "numba>=0.59",
]
keywords = ["topology optimization", "generative design", "3d printing", "fea", "cad"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/connorwhite-online/loadpath"
Documentation = "https://github.com/connorwhite-online/loadpath/tree/main/docs"
Repository = "https://github.com/connorwhite-online/loadpath"
Issues = "https://github.com/connorwhite-online/loadpath/issues"

[project.optional-dependencies]
render = ["matplotlib>=3.8", "shapely>=2.0", "fast_simplification>=0.1"]   # shapely: render_interfaces slices meshes; fast_simplification: decimation for renders and viewers
mcp = ["mcp>=2.0", "matplotlib>=3.8", "shapely>=2.0"]
# torch runs the large-grid multigrid solve (mg.py) on a GPU: CUDA, or Metal
# (MPS) on Apple Silicon; on the CPU alone it beats the numpy kernels (gpu.py)
gpu = ["torch>=2.2"]
# independent cross-check on a tetrahedral mesh (crosscheck.py): fTetWild
# (pytetwild, MPL-2.0; its package imports pyvista) meshes, gmsh (GPL, run as
# a tool, not part of loadpath's own code) is the fallback mesher
# lattice-Boltzmann flow and heat transfer (flow.py)
flow = ["numba>=0.59"]
# (and PARDISO on x86-64, as in `fast`: the buckling check and the constrained
# method's buckling factorizations; SuperLU ran a wall-bracket search out of
# a 15 GB box)
crosscheck = ["gmsh>=4.11", "pytetwild>=0.4", "pyvista>=0.44",
              "pypardiso>=0.4; platform_machine == 'x86_64' or platform_machine == 'AMD64'"]
# PARDISO (Intel MKL, x86-64 only) for the buckling constraint's eigensolves
# (bucklingopt.py) and the lattice buckling tables: 2-3x SuperLU's speed and a
# fraction of its memory on 3D hex meshes; SuperLU is the fallback
fast = ["pypardiso>=0.4"]
# vision critic over interface close-ups (critic.py, evals --critic anthropic)
critic = ["anthropic", "matplotlib>=3.8", "shapely>=2.0"]
# STEP export with exact planes and cylinders (step.py): OpenCascade's Python bindings
step = ["cadquery-ocp>=7.7", "embreex>=4.3"]   # embreex: fast ray casts for surface="smooth" (falls back to trimesh's own)
# the exterior intake's wrap (exterior.py): libigl's generalized winding number
# reads open, self-intersecting, double-walled meshes (AI-generated, scanned)
# right; without it a flood fill seals holes up to a few grid cells
exterior = ["libigl>=2.5"]
# section polars for propellers (propeller.py): NeuralFoil, a network trained on XFOIL (MIT; brings aerosandbox)
aero = ["neuralfoil>=0.3"]
"3mf" = ["lib3mf>=2.4", "pillow>=9"]   # lattice3mf.py: implicit (TPMS) and beam-lattice 3MF; pillow writes the 16-bit image stacks

[project.scripts]
loadpath = "loadpath.__main__:_main"

[tool.setuptools.packages.find]
include = ["loadpath*"]

[tool.setuptools.package-data]
"loadpath" = ["SKILL.md", "README.md", "viewer.html", "editor.html", "wires_viewer.html", "examples/*.json", "calibrations/*.json", "data/*.json"]
"loadpath.evals" = ["cases/*.json", "cases/*.stl", "baselines/*.json", "briefs/*.json", "briefs/assets/*"]
"loadpath.benchmarks" = ["cases/*.json", "reference/*.npz"]
