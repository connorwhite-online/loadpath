[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loadpath"
version = "0.1.0"
description = "Generative design for printed parts: topology optimization from keep-outs, preserved geometry and loads, verified in real units."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyamg>=5.0",
  "scikit-image>=0.22",
  "trimesh>=4.0",
  "manifold3d>=3.0",
  "rtree>=1.0",
]
keywords = ["topology optimization", "generative design", "3d printing", "fea", "cad"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
render = ["matplotlib>=3.8", "shapely>=2.0", "fast_simplification>=0.1"]   # shapely: render_interfaces slices meshes; fast_simplification: decimation for renders and viewers
mcp = ["mcp>=2.0", "matplotlib>=3.8", "shapely>=2.0"]
# torch runs the large-grid multigrid solve (mg.py) on a GPU: CUDA, or Metal
# (MPS) on Apple Silicon; on the CPU alone it beats the numpy kernels (gpu.py)
gpu = ["torch>=2.2"]
# independent cross-check on a tetrahedral mesh (crosscheck.py): fTetWild
# (pytetwild, MPL-2.0; its package imports pyvista) meshes, gmsh (GPL, run as
# a tool, not part of loadpath's own code) is the fallback mesher
crosscheck = ["gmsh>=4.11", "pytetwild>=0.4", "pyvista>=0.44"]
# vision critic over interface close-ups (critic.py, evals --critic anthropic)
critic = ["anthropic", "matplotlib>=3.8", "shapely>=2.0"]

[project.scripts]
loadpath = "loadpath.__main__:main"

[tool.setuptools.packages.find]
include = ["loadpath*"]

[tool.setuptools.package-data]
"loadpath" = ["SKILL.md", "README.md", "viewer.html", "editor.html", "examples/*.json", "calibrations/*.json"]
"loadpath.evals" = ["cases/*.json", "cases/*.stl", "baselines/*.json"]
"loadpath.benchmarks" = ["cases/*.json", "reference/*.npz"]
